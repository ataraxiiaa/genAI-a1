services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount trained ONNX models and dataset images without bloating image size
      - ./checkpoints:/app/checkpoints:ro
      - ./universal-restoration/checkpoints:/app/universal-restoration/checkpoints:ro
      - ./images:/app/images:ro
      - ./FS2K:/app/FS2K:ro
      - ./manifests:/app/manifests:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
